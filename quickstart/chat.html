<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>YASAKANI chat</title>
<!--
  YASAKANI quickstart: the chat page (one file, nothing loaded from the network).
  It is served by quickstart.py on 127.0.0.1 and talks only to that address, which passes the requests on to `yasakani serve`.
  Apache License 2.0 - part of https://github.com/yasakani-dev/yasakani
-->
<style>
  :root {
    --bg: #0a0a0b; --panel: #141416; --panel2: #1d1d20; --line: #2e2e33;
    --ink: #f4f2ec; --ink2: #b9b4a8; --dim: #7c786e;
    --accent: #ecc97f; --accent-fill: #ecc97f; --on-accent: #0a0a0b; --err: #e8857f;
    --sans: "Yu Gothic UI", "Meiryo UI", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --meter: Bahnschrift, "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, "BIZ UDGothic", "MS Gothic", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f4f3ef; --panel2: #e9e8e2; --line: #d6d4cc;
      --ink: #17171a; --ink2: #55524b; --dim: #86837a;
      --accent: #765810; --accent-fill: #ecc97f; --on-accent: #17171a; --err: #b3372f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.7 var(--sans); display: flex; flex-direction: column; }
  button, textarea, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 20px; padding: 10px 24px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: 0.14em; }
  .model { color: var(--ink2); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter { margin-left: auto; text-align: right; font-family: var(--meter); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter .num { font-size: 40px; font-weight: 600; line-height: 1; color: var(--accent); }
  .meter .unit { font-size: 15px; color: var(--ink2); margin-left: 6px; }
  .meter .what { display: block; font-family: var(--sans); font-size: 12px; color: var(--dim); line-height: 1.3; min-height: 1.3em; }

  main { flex: 1; overflow-y: auto; padding: 28px 24px 12px; }
  .col { max-width: 880px; margin: 0 auto; }
  .turn { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 20px; padding: 14px 0; border-top: 1px solid var(--line); }
  .turn:first-child { border-top: 0; }
  .who { color: var(--dim); font-size: 13px; padding-top: 3px; }
  .turn.me .who { color: var(--ink2); }
  .turn.ai .who { color: var(--accent); font-weight: 700; letter-spacing: 0.06em; }
  .body { min-width: 0; overflow-wrap: anywhere; }
  .body p { margin: 0 0 0.6em; white-space: pre-wrap; }
  .body p.h { font-weight: 700; font-size: 1.1em; margin: 1.1em 0 0.35em; }
  .body p.h:first-child { margin-top: 0; }
  .body blockquote { margin: 0 0 0.6em; padding: 1px 0 1px 14px; border-left: 2px solid var(--dim); white-space: pre-wrap; }
  .body p:last-child, .body blockquote:last-child { margin-bottom: 0; }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .body .tw { overflow-x: auto; margin: 0.3em 0 0.8em; }
  .body table { border-collapse: collapse; font-size: 0.95em; }
  .body th, .body td { border: 1px solid var(--line); padding: 5px 11px; text-align: left; vertical-align: top; }
  .body th { background: var(--panel); font-weight: 700; }
  .body pre { margin: 0.4em 0 0.8em; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto;
              font: 14px/1.55 var(--mono); white-space: pre; }
  .body code { font-family: var(--mono); font-size: 0.92em; background: var(--panel); padding: 0.05em 0.3em; border-radius: 4px; }
  .body pre code { background: none; padding: 0; font-size: 1em; }
  details.think { margin: 0 0 0.7em; color: var(--ink2); font-size: 14px; }
  details.think summary { cursor: pointer; color: var(--dim); width: fit-content; }
  details.think .t { white-space: pre-wrap; border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin-top: 6px; }
  .stamp { grid-column: 2; font-family: var(--meter); font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 22px; }
  .stamp b { color: var(--ink2); font-weight: 600; }
  .note { grid-column: 2; color: var(--err); font-size: 14px; }

  .empty { padding: 7vh 0 2vh; }
  .empty h1 { font-size: 30px; line-height: 1.35; margin: 0 0 6px; font-weight: 700; }
  .empty p { color: var(--ink2); margin: 0 0 26px; }
  .tries { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .tries button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; text-align: left; cursor: pointer; color: var(--ink); }
  .tries button:hover { border-color: var(--accent); }

  .composer { border-top: 1px solid var(--line); padding: 14px 24px 10px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  textarea { flex: 1; min-height: 52px; max-height: 40vh; resize: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; line-height: 1.6; }
  textarea::placeholder { color: var(--dim); }
  textarea:focus-visible { outline: none; border-color: var(--accent); }
  .send { background: var(--accent-fill); color: var(--on-accent); border: 0; border-radius: 8px; padding: 0 22px; height: 52px; min-width: 96px; font-weight: 700; cursor: pointer; }
  .send[disabled] { opacity: 0.45; cursor: default; }
  .send.stop { background: none; color: var(--ink); border: 1px solid var(--ink2); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 26px; align-items: center; margin-top: 8px; color: var(--ink2); font-size: 14px; }
  .opts label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .opts input { width: 17px; height: 17px; accent-color: var(--accent-fill); }
  .link { background: none; border: 0; padding: 0; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .local { margin-left: auto; color: var(--dim); }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 24px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: baseline; }
  footer strong { color: var(--accent); font-size: 17px; }
  footer a { color: var(--ink); text-underline-offset: 3px; }
  footer span { color: var(--ink2); }

  @media (max-width: 640px) {
    header { padding: 8px 14px; gap: 12px; }
    .meter .num { font-size: 30px; }
    main { padding: 16px 14px 8px; }
    .turn { grid-template-columns: minmax(0, 1fr); }
    .stamp, .note { grid-column: 1; }
    .composer { padding: 10px 14px 8px; }
    .local { margin-left: 0; }
    footer { padding: 8px 14px; }
    .empty h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">YASAKANI</div>
  <div class="model" id="model"></div>
  <div class="meter" title="tokens per second"><span class="num" id="num">–</span><span class="unit">tok/s</span><span class="what" id="what"></span></div>
</header>
<main id="main"><div class="col" id="log"></div></main>
<div class="composer"><div class="col">
  <div class="row">
    <textarea id="box" rows="1" autofocus></textarea>
    <button class="send" id="send" type="button"></button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="think" checked><span id="l_think"></span></label>
    <button class="link" id="fresh" type="button"></button>
    <span class="local" id="l_local"></span>
  </div>
</div></div>
<footer id="support"></footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const CSV = 'name,age,city\nSato,34,Tokyo\nSuzuki,28,Osaka\nTakahashi,41,Nagoya\nTanaka,25,Fukuoka\nIto,37,Sapporo\nWatanabe,52,Sendai';
const TEXT = {
  ja: {
    title: 'YASAKANI チャット', me: 'あなた', ai: 'YASAKANI',
    m_speed: '最速モデル', m_quality: '品質モデル', m_custom: 'モデル', ctx: '文脈 {n} トークンまで',
    loading: 'モデルを読み込んでいます…', gone: 'サーバーに届きません',
    ph: 'メッセージを書く（Enter で送る、Shift+Enter で改行）', send: '送る', stop: '止める',
    think: '考えてから答える', fresh: '新しい会話', local: 'このパソコンの中だけで動いています。会話はどこにも送られません。',
    e_title: 'このパソコンの GPU で、Qwen3.8-27B が答えます', e_sub: '右上の数字が、いまの速さです。まずは下の例を押してみてください。',
    tries: ['Python でクイックソートを書いて、短く説明して',
            ['CSV を JSON に直して', '次の CSV を JSON の配列に直してください。\n\n' + CSV],
            '量子コンピュータを、中学生にもわかるように説明して'],
    thinking: '考えています（{n} トークン）', thought: '考えた内容（{n} トークン）',
    w_now: 'いまの速さ', w_avg: 'この回答の平均', w_idle: '',
    s_tok: '{n} トークン', s_sec: '{n} 秒', s_think: 'うち思考 {n}',
    stopped: '止めました。', cut: '上限の長さに達したので、ここで止まりました。',
    err_net: 'サーバーに届きませんでした。起動ファイルの黒い画面が開いたままか確かめて、もう一度送ってください。',
    err_http: 'サーバーが断りました（{c}）: {m}',
    sup: [['strong', '開発を応援してください'], ['a', 'CAMPFIRE のクラウドファンディング（2026 年 12 月 16 日まで）', 'support'], ['a', 'GitHub', 'repo']],
  },
  en: {
    title: 'YASAKANI chat', me: 'You', ai: 'YASAKANI',
    m_speed: 'fastest model', m_quality: 'quality model', m_custom: 'model', ctx: 'context up to {n} tokens',
    loading: 'Loading the model…', gone: 'The server cannot be reached',
    ph: 'Write a message (Enter sends, Shift+Enter starts a new line)', send: 'Send', stop: 'Stop',
    think: 'Think before answering', fresh: 'New conversation', local: 'Runs on this computer only. The conversation is not sent anywhere.',
    e_title: 'Qwen3.8-27B answers on the GPU of this computer', e_sub: 'The number at the top right is the current speed. Try one of these first.',
    tries: ['Write quicksort in Python and explain it briefly',
            ['Turn a CSV into JSON', 'Convert this CSV to a JSON array.\n\n' + CSV],
            'Explain quantum computers to a 14-year-old'],
    thinking: 'Thinking ({n} tokens)', thought: 'What it thought ({n} tokens)',
    w_now: 'current speed', w_avg: 'average of this answer', w_idle: '',
    s_tok: '{n} tokens', s_sec: '{n} s', s_think: '{n} of them thinking',
    stopped: 'Stopped.', cut: 'The length limit was reached, so it stopped here.',
    err_net: 'The server could not be reached. Check that the black quickstart window is still open, then send again.',
    err_http: 'The server refused the request ({c}): {m}',
    sup: [['strong', 'Like it?'], ['a', 'A star on GitHub helps', 'repo'], ['a', 'Crowdfunding on CAMPFIRE', 'support'], ['span', '(open to residents of Japan, until 16 Dec 2026)']],
  },
};
let L = TEXT[(navigator.language || 'en').toLowerCase().startsWith('ja') ? 'ja' : 'en'];
const t = (k, v) => String(L[k]).replace(/\{(\w)\}/g, (m, a) => (v && a in v ? v[a] : m));
const fmt = n => Number(n).toLocaleString('en-US');
const cfg = { lang: null, model: 'custom', repo: 'https://github.com/yasakani-dev/yasakani', support: 'https://camp-fire.jp/projects/992233/view' };

let history = [];              // {role, content} sent to the server
let busy = null;               // AbortController while an answer is being written
let ready = false;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function applyLanguage() {
  document.documentElement.lang = L === TEXT.ja ? 'ja' : 'en';
  document.title = L.title;
  $('box').placeholder = L.ph; $('l_think').textContent = L.think; $('fresh').textContent = L.fresh; $('l_local').textContent = L.local;
  const f = $('support'); f.textContent = '';
  for (const [tag, text, key] of L.sup) {
    const e = el(tag, null, text);
    if (tag === 'a') { e.href = cfg[key]; e.target = '_blank'; e.rel = 'noopener noreferrer'; }
    f.appendChild(e);
  }
  setButton();
  if (!history.length && !busy) showEmpty();
}
function setButton() {
  const b = $('send');
  b.textContent = busy ? L.stop : L.send; b.classList.toggle('stop', !!busy);
  b.disabled = !busy && (!ready || !$('box').value.trim());
}
function showModel(h) {
  const name = t('m_' + (cfg.model in { speed: 1, quality: 1 } ? cfg.model : 'custom'));
  if (!h) { $('model').textContent = L.gone; return; }
  if (h.status !== 'ok') { $('model').textContent = name + '　' + L.loading; return; }
  $('model').textContent = name + '　' + (h.model || '') + (h.max_context_tokens ? '　' + t('ctx', { n: fmt(h.max_context_tokens) }) : '');
}
function showEmpty() {
  const log = $('log'); log.textContent = '';
  const box = el('div', 'empty');
  box.appendChild(el('h1', null, L.e_title)); box.appendChild(el('p', null, L.e_sub));
  const tries = el('div', 'tries');
  for (const s of L.tries) {
    const [label, prompt] = Array.isArray(s) ? s : [s, s];
    const b = el('button', null, label); b.type = 'button'; b.onclick = () => { if (!busy && ready) { $('box').value = prompt; send(); } }; tries.appendChild(b);
  }
  box.appendChild(tries); log.appendChild(box);
}

// ---- rendering of one answer.  Everything goes in as text, never as HTML.  The Markdown marks the model uses most are
//      shown as what they mean: ``` fenced blocks, `inline code`, **bold**, # headings, > quotes, - lists, --- rules and
//      | tables |.  Anything else (links, formulas, *italics*) stays as it was written.
function codeInto(node, text) {
  text.split(/(`[^`\n]+`)/).forEach(seg => {
    if (seg.length > 2 && seg[0] === '`' && seg[seg.length - 1] === '`') node.appendChild(el('code', null, seg.slice(1, -1)));
    else if (seg) node.appendChild(document.createTextNode(seg));
  });
}
function inlineInto(node, text) {
  text.split(/(`[^`\n]+`|\*\*(?=\S)[^*\n]*?[^*\s]\*\*)/).forEach(seg => {
    if (seg.length > 4 && seg.startsWith('**') && seg.endsWith('**')) { const s = el('strong'); codeInto(s, seg.slice(2, -2)); node.appendChild(s); }
    else codeInto(node, seg);
  });
}
const isRow = s => /^\s*\|.*\|\s*$/.test(s);
const rowCells = s => s.trim().slice(1, -1).split('|').map(c => c.trim());
const isRule = s => isRow(s) && rowCells(s).every(c => /^:?-+:?$/.test(c));
function proseInto(node, part) {
  const lines = part.split('\n');
  let cur = null, curKind = '';
  const add = (kind, text) => {
    if (!cur || curKind !== kind) { cur = el(kind === 'q' ? 'blockquote' : 'p'); curKind = kind; node.appendChild(cur); }
    else cur.appendChild(document.createTextNode('\n'));
    inlineInto(cur, text);
  };
  for (let i = 0; i < lines.length; i++) {
    const s = lines[i].replace(/\s+$/, '');
    let m;
    if (!s) { cur = null; continue; }
    if (isRow(s) && i + 1 < lines.length && isRule(lines[i + 1]) && rowCells(lines[i + 1]).length === rowCells(s).length) {
      cur = null;
      const table = el('table'), n = rowCells(s).length;
      const row = (text, tag) => { const tr = el('tr'); rowCells(text).slice(0, n).forEach(c => { const cell = el(tag); inlineInto(cell, c); tr.appendChild(cell); }); table.appendChild(tr); };
      row(s, 'th');
      for (i += 2; i < lines.length && isRow(lines[i]); i++) row(lines[i], 'td');
      i--;
      const wrap = el('div', 'tw'); wrap.appendChild(table); node.appendChild(wrap);
      continue;
    }
    if ((m = /^ {0,3}#{1,6}\s+(.+)$/.exec(s))) { cur = null; const h = el('p', 'h'); inlineInto(h, m[1]); node.appendChild(h); continue; }
    if (/^ {0,3}(?:-{3,}|\*{3,}|_{3,})$/.test(s)) { cur = null; node.appendChild(el('hr')); continue; }
    if ((m = /^ {0,3}>\s?(.*)$/.exec(s))) { add('q', m[1]); continue; }
    if ((m = /^(\s*)[-*+]\s+(.+)$/.exec(s))) { add('p', m[1] + '• ' + m[2]); continue; }
    add('p', s);
  }
}
function renderInto(node, raw) {
  node.textContent = '';
  raw.split(/```/).forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf('\n');
      const code = nl >= 0 && /^[\w+#.-]{0,20}$/.test(part.slice(0, nl).trim()) ? part.slice(nl + 1) : part;
      const pre = el('pre'); pre.appendChild(el('code', null, code.replace(/\n$/, ''))); node.appendChild(pre);
      return;
    }
    proseInto(node, part);
  });
}
const nearBottom = () => { const m = $('main'); return m.scrollHeight - m.scrollTop - m.clientHeight < 120; };
const toBottom = () => { const m = $('main'); m.scrollTop = m.scrollHeight; };

function addTurn(kind, text) {
  const log = $('log');
  if (log.querySelector('.empty')) log.textContent = '';
  const turn = el('div', 'turn ' + kind);
  turn.appendChild(el('div', 'who', kind === 'me' ? L.me : L.ai));
  const body = el('div', 'body'); turn.appendChild(body);
  if (text !== undefined) { const p = el('p', null, text); body.appendChild(p); }
  log.appendChild(turn); toBottom();
  return { turn, body };
}

// ---- the speed meter: tokens that arrived in the last second
const arrivals = [];
let meterTimer = null, meterFirst = 0;
function meterTick() {
  const now = performance.now();
  while (arrivals.length && now - arrivals[0] > 1000) arrivals.shift();
  if (!busy) return;
  if (arrivals.length && !meterFirst) meterFirst = arrivals[0];
  const span = Math.min(1000, now - meterFirst);            // in the first second, divide by the time that has passed
  $('num').textContent = arrivals.length && span >= 250 ? fmt(Math.round(arrivals.length * 1000 / span)) : '–';
  $('what').textContent = L.w_now;
}
function meterStart() { arrivals.length = 0; meterFirst = 0; $('num').textContent = '–'; $('what').textContent = L.w_now; meterTimer = setInterval(meterTick, 200); }
function meterEnd(avg) { clearInterval(meterTimer); meterTimer = null; $('num').textContent = avg ? fmt(Math.round(avg)) : '–'; $('what').textContent = avg ? L.w_avg : L.w_idle; }

async function send() {
  const box = $('box');
  const text = box.value.trim();
  if (!text || busy || !ready) return;
  box.value = ''; grow();
  addTurn('me', text);
  const conv = history;
  history.push({ role: 'user', content: text });
  const { turn, body } = addTurn('ai');
  const think = el('details', 'think'); const sum = el('summary'); const thinkText = el('div', 't');
  think.appendChild(sum); think.appendChild(thinkText);
  const answer = el('div');
  let reasoning = '', content = '', nThink = 0, nAnswer = 0, tFirst = 0, tLast = 0, usage = null, finish = null, failed = null, dirty = false;
  const paint = () => {
    if (!dirty) return; dirty = false;
    const stick = nearBottom();
    if (reasoning && !think.parentNode) { body.insertBefore(think, body.firstChild); think.open = true; }
    if (reasoning) { thinkText.textContent = reasoning; sum.textContent = t(content ? 'thought' : 'thinking', { n: fmt(nThink) }); if (content && think.open && !think.dataset.kept) { think.open = false; think.dataset.kept = '1'; } }
    if (content) { if (!answer.parentNode) body.appendChild(answer); renderInto(answer, content); }
    if (stick) toBottom();
  };
  const painter = setInterval(paint, 66);
  busy = new AbortController(); setButton(); meterStart();
  const payload = { messages: history.slice(), stream: true, stream_options: { include_usage: true } };
  if (!$('think').checked) payload.chat_template_kwargs = { enable_thinking: false };
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: busy.signal });
    if (!r.ok) {
      let m = r.statusText;
      try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (e) { /* not JSON */ }
      throw Object.assign(new Error(t('err_http', { c: r.status, m })), { shown: true });
    }
    const reader = r.body.getReader(); const dec = new TextDecoder('utf-8');
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, cut).trim(); buf = buf.slice(cut + 2);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        let o; try { o = JSON.parse(data); } catch (e) { continue; }
        if (o.error) { failed = t('err_http', { c: o.error.code || 500, m: o.error.message || '' }); continue; }
        if (o.usage) usage = o.usage;
        const c = o.choices && o.choices[0];
        if (!c) continue;
        if (c.finish_reason) finish = c.finish_reason;
        const d = c.delta || {};
        const now = performance.now();
        if (typeof d.reasoning_content === 'string' && d.reasoning_content) { reasoning += d.reasoning_content; nThink++; }
        else if (typeof d.content === 'string' && d.content) { content += d.content; nAnswer++; }
        else continue;
        if (!tFirst) tFirst = now;
        tLast = now; arrivals.push(now); dirty = true;
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') failed = L.stopped; else failed = e.shown ? e.message : L.err_net;
  }
  clearInterval(painter);
  if (conv !== history) return;
  dirty = true; paint();
  busy = null; setButton();
  const n = usage ? usage.completion_tokens : nThink + nAnswer;
  const secs = (tLast - tFirst) / 1000;
  const avg = n >= 16 && secs > 0.15 ? (n - 1) / secs : 0;
  meterEnd(avg);
  if (n > 0) {
    const stamp = el('div', 'stamp');
    if (avg) { const s = el('span'); s.appendChild(el('b', null, fmt(Math.round(avg)))); s.appendChild(document.createTextNode(' tok/s')); stamp.appendChild(s); }
    stamp.appendChild(el('span', null, t('s_tok', { n: fmt(n) })));
    const nt = usage && usage.completion_tokens_details ? usage.completion_tokens_details.reasoning_tokens : nThink;
    if (nt) stamp.appendChild(el('span', null, t('s_think', { n: fmt(nt) })));
    if (secs > 0) stamp.appendChild(el('span', null, t('s_sec', { n: secs.toFixed(2) })));
    turn.appendChild(stamp);
  }
  if (failed) turn.appendChild(el('div', 'note', failed));
  else if (finish === 'length') turn.appendChild(el('div', 'note', L.cut));
  if (content) history.push({ role: 'assistant', content });
  else history.pop();                    // nothing was answered: the question is not kept, so it can be sent again
  if (nearBottom()) toBottom();
  $('box').focus();
}

function grow() { const b = $('box'); b.style.height = 'auto'; b.style.height = Math.min(b.scrollHeight + 2, window.innerHeight * 0.4) + 'px'; setButton(); }
$('box').addEventListener('input', grow);
$('box').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
});
$('send').addEventListener('click', () => { if (busy) busy.abort(); else send(); });
$('fresh').addEventListener('click', () => { if (busy) busy.abort(); busy = null; history = []; meterEnd(0); showEmpty(); setButton(); $('box').focus(); });

async function poll() {
  let h = null;
  try { const r = await fetch('/health', { cache: 'no-store' }); h = await r.json(); } catch (e) { h = null; }
  ready = !!(h && h.status === 'ok');
  showModel(h); setButton();
  setTimeout(poll, ready ? 15000 : 1500);
}
(async function start() {
  try {
    const r = await fetch('/webchat/config', { cache: 'no-store' });
    if (r.ok) Object.assign(cfg, await r.json());
  } catch (e) { /* the defaults stay */ }
  if (cfg.lang && TEXT[cfg.lang]) L = TEXT[cfg.lang];
  applyLanguage(); grow(); poll();
})();
</script>
