<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>YASAKANI chat</title>
<!--
  YASAKANI quickstart: the chat page (one file, nothing loaded from the network).
  It is served by quickstart.py on 127.0.0.1 and talks only to that address, which passes the requests on to `yasakani serve`.
  Four tabs: chat, speed, API, model.  The address can name the tab to open: #chat (the default), #speed, #api or #model.
  Apache License 2.0 - part of https://github.com/yasakani-dev/yasakani
-->
<style>
  :root {
    --bg: #0a0a0b; --panel: #141416; --panel2: #1d1d20; --line: #2e2e33;
    --ink: #f4f2ec; --ink2: #b9b4a8; --dim: #7c786e;
    --accent: #ecc97f; --accent-fill: #ecc97f; --on-accent: #0a0a0b; --err: #e8857f;
    --sans: "Yu Gothic UI", "Meiryo UI", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --meter: Bahnschrift, "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, "BIZ UDGothic", "MS Gothic", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f4f3ef; --panel2: #e9e8e2; --line: #d6d4cc;
      --ink: #17171a; --ink2: #55524b; --dim: #86837a;
      --accent: #765810; --accent-fill: #ecc97f; --on-accent: #17171a; --err: #b3372f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.7 var(--sans); display: flex; flex-direction: column; }
  button, textarea, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 20px; padding: 10px 24px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: 0.14em; }
  .model { color: var(--ink2); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model .st { color: var(--ink); margin-right: 1em; font-variant-numeric: tabular-nums; }
  .model .st::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 8px; }
  .model.ready .st::before { background: var(--accent); }
  .model.wait .st::before { background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
  .model.bad .st { color: var(--err); }
  .model.bad .st::before { background: var(--err); }
  @keyframes blink { 50% { opacity: 0.25; } }
  .meter { margin-left: auto; text-align: right; font-family: var(--meter); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter .num { font-size: 40px; font-weight: 600; line-height: 1; color: var(--accent); }
  .meter .unit { font-size: 15px; color: var(--ink2); margin-left: 6px; }
  .meter .what { display: block; font-family: var(--sans); font-size: 12px; color: var(--dim); line-height: 1.3; min-height: 1.3em; }
  .btn2 { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 14px; font-size: 14px; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .btn2:hover { border-color: var(--accent); }
  .btn2[disabled] { opacity: 0.45; cursor: default; border-color: var(--line); }
  header .btn2 { color: var(--ink2); }

  .tabs { display: flex; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px 7px; color: var(--ink2); font-size: 15px; cursor: pointer; white-space: nowrap; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .tabs button:focus-visible { outline-offset: -2px; }

  .load { padding: 12px 24px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .load .lt { font-size: 15px; font-variant-numeric: tabular-nums; }
  .load.bad .lt { color: var(--err); }
  .load .lh { color: var(--dim); font-size: 13px; }
  .track { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin: 8px 0 6px; }
  .track i { display: block; height: 100%; width: 32%; background: var(--accent-fill); border-radius: 2px; animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(313%); } }
  @media (prefers-reduced-motion: reduce) {
    .track i { animation: none; width: 100%; opacity: 0.5; }
    .model.wait .st::before { animation: none; }
  }

  .pane { flex: 1; min-height: 0; }
  .pane.chat { display: flex; flex-direction: column; }
  .pane.page { overflow-y: auto; padding: 28px 24px 24px; }
  .pane[hidden] { display: none; }
  main { flex: 1; overflow-y: auto; padding: 28px 24px 12px; }
  .col { max-width: 880px; margin: 0 auto; }
  .turn { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 20px; padding: 14px 0; border-top: 1px solid var(--line); }
  .turn:first-child { border-top: 0; }
  .who { color: var(--dim); font-size: 13px; padding-top: 3px; }
  .turn.me .who { color: var(--ink2); }
  .turn.ai .who { color: var(--accent); font-weight: 700; letter-spacing: 0.06em; }
  .body { min-width: 0; overflow-wrap: anywhere; }
  .body p { margin: 0 0 0.6em; white-space: pre-wrap; }
  .body p.h { font-weight: 700; font-size: 1.1em; margin: 1.1em 0 0.35em; }
  .body p.h:first-child { margin-top: 0; }
  .body blockquote { margin: 0 0 0.6em; padding: 1px 0 1px 14px; border-left: 2px solid var(--dim); white-space: pre-wrap; }
  .body p:last-child, .body blockquote:last-child { margin-bottom: 0; }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .body .tw { overflow-x: auto; margin: 0.3em 0 0.8em; }
  .body table { border-collapse: collapse; font-size: 0.95em; }
  .body th, .body td { border: 1px solid var(--line); padding: 5px 11px; text-align: left; vertical-align: top; }
  .body th { background: var(--panel); font-weight: 700; }
  .cb { position: relative; margin: 5.6px 0 11.2px; padding-top: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .cb pre { margin: 0; padding: 2px 14px 12px; overflow-x: auto; font: 14px/1.55 var(--mono); white-space: pre; }
  .body code { font-family: var(--mono); font-size: 0.92em; background: var(--panel); padding: 0.05em 0.3em; border-radius: 4px; }
  .cb pre code { font-family: inherit; background: none; padding: 0; font-size: 1em; }
  .copy { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 9px; font: 12px/1.7 var(--sans); color: var(--ink2); cursor: pointer; white-space: nowrap; }
  .copy:hover { border-color: var(--accent); color: var(--ink); }
  .copy[disabled] { opacity: 0.45; cursor: default; border-color: var(--line); }
  .cb .copy { position: absolute; top: 5px; right: 6px; }       /* in the row above the code, so it never lies over a long line */
  details.think { margin: 0 0 0.7em; color: var(--ink2); font-size: 14px; }
  details.think summary { cursor: pointer; color: var(--dim); width: fit-content; }
  details.think .t { white-space: pre-wrap; border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin-top: 6px; }
  .stamp { grid-column: 2; font-family: var(--meter); font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 22px; }
  .stamp b { color: var(--ink2); font-weight: 600; }
  .note { grid-column: 2; color: var(--err); font-size: 14px; }

  .empty { padding: 7vh 0 2vh; }
  .empty h1 { font-size: 30px; line-height: 1.35; margin: 0 0 6px; font-weight: 700; }
  .empty p { color: var(--ink2); margin: 0 0 26px; }
  .tries { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .tries button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; text-align: left; cursor: pointer; color: var(--ink); }
  .tries button:hover { border-color: var(--accent); }
  .tries button[disabled] { opacity: 0.45; cursor: default; border-color: var(--line); }

  .composer { border-top: 1px solid var(--line); padding: 14px 24px 10px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  textarea { flex: 1; min-height: 52px; max-height: 40vh; resize: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; line-height: 1.6; }
  textarea::placeholder { color: var(--dim); }
  textarea:focus-visible { outline: none; border-color: var(--accent); }
  textarea[disabled] { opacity: 0.6; }
  .send { background: var(--accent-fill); color: var(--on-accent); border: 0; border-radius: 8px; padding: 0 22px; height: 52px; min-width: 96px; font-weight: 700; cursor: pointer; }
  .send[disabled] { opacity: 0.45; cursor: default; }
  .send.stop { background: none; color: var(--ink); border: 1px solid var(--ink2); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 26px; align-items: center; margin-top: 8px; color: var(--ink2); font-size: 14px; }
  .opts label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .opts input { width: 17px; height: 17px; accent-color: var(--accent-fill); }
  .opts select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; cursor: pointer; }
  .opts select[disabled] { opacity: 0.45; cursor: default; }
  .opts option { background: var(--panel); color: var(--ink); }
  .link { background: none; border: 0; padding: 0; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .attach { background: none; color: var(--ink2); border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; height: 52px; cursor: pointer; }
  .attach:hover { border-color: var(--accent); color: var(--ink); }
  .attach[disabled] { opacity: 0.45; cursor: default; border-color: var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px 2px 10px; font-size: 13px; color: var(--ink2); max-width: 100%; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 0 6px; font-size: 15px; line-height: 1; }
  .chip button:hover { color: var(--ink); }
  .imgnote { color: var(--err); font-size: 14px; margin-bottom: 6px; }
  .imgs { color: var(--dim); font-size: 13px; margin-bottom: 4px; }
  .composer.dropping { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .local { margin-left: auto; color: var(--dim); }

  .upd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 24px; background: var(--panel2); border-bottom: 1px solid var(--line); font-size: 15px; }
  .upd[hidden] { display: none; }
  .upd button.go { background: var(--accent-fill); color: var(--on-accent); border: 0; border-radius: 6px; padding: 4px 16px; font-weight: 700; cursor: pointer; }
  .upd button[disabled] { opacity: 0.45; cursor: default; }

  .page h2 { font-size: 24px; line-height: 1.35; margin: 0 0 6px; font-weight: 700; }
  .page h3 { font-size: 13px; line-height: 1.7; color: var(--dim); font-weight: 400; margin: 18px 0 0; }
  .page .lead { color: var(--ink2); margin: 0 0 22px; }
  .page h2 + .kv { margin-top: 14px; }
  .hint { color: var(--dim); font-size: 14px; margin: 6px 0 0; }
  .hint:empty { display: none; }
  .hint.bad { color: var(--err); }
  .kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 4px 20px; padding: 14px 0; border-top: 1px solid var(--line); }
  .kv[hidden] { display: none; }
  .kv .k { color: var(--dim); font-size: 13px; padding-top: 3px; }
  .kv .v { min-width: 0; overflow-wrap: anywhere; }
  .kv .sub { color: var(--ink2); font-size: 14px; margin-left: 1em; }
  #chk_upd { margin-left: 1em; padding: 2px 10px; font-size: 13px; }
  #chk_upd[hidden] { display: none; }
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .line code { font-family: var(--mono); font-size: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 9px; min-width: 0; overflow-wrap: anywhere; }
  .line .nm { font-weight: 700; }
  .line .cur { color: var(--accent); font-size: 13px; }
  #m_list .line { padding: 3px 0; min-height: 40px; }
  .btn { background: var(--accent-fill); color: var(--on-accent); border: 0; border-radius: 8px; padding: 0 22px; height: 46px; min-width: 120px; font-weight: 700; cursor: pointer; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn.stop { background: none; color: var(--ink); border: 1px solid var(--ink2); }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0 14px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 12px; background: var(--panel); min-width: 0; }
  .tile .k { color: var(--dim); font-size: 13px; }
  .tile .n { font-family: var(--meter); font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 600; line-height: 1.2; }
  .tile.main .n { color: var(--accent); }
  .tile .u { font-family: var(--meter); font-size: 14px; color: var(--ink2); margin-left: 6px; white-space: nowrap; }
  .mem { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; margin: 8px 0 6px; max-width: 520px; }
  .mem i { display: block; height: 100%; width: 0; background: var(--accent-fill); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 24px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: baseline; }
  footer strong { color: var(--accent); font-size: 17px; }
  footer a { color: var(--ink); text-underline-offset: 3px; }
  footer span { color: var(--ink2); }

  @media (max-width: 640px) {
    header { padding: 8px 14px; gap: 2px 12px; flex-wrap: wrap; }
    .brand { font-size: 18px; }
    .model { order: 5; flex: 0 0 100%; }
    .meter .num { font-size: 30px; }
    .tabs { padding: 0 4px; gap: 0; }
    .tabs button { padding: 8px 9px 6px; font-size: 14px; }
    .load { padding: 10px 14px 8px; }
    .upd { padding: 8px 14px; }
    main { padding: 16px 14px 8px; }
    .pane.page { padding: 16px 14px 16px; }
    .turn { grid-template-columns: minmax(0, 1fr); }
    .stamp, .note { grid-column: 1; }
    .composer { padding: 10px 14px 8px; }
    .local { margin-left: 0; }
    footer { padding: 8px 14px; }
    .empty h1 { font-size: 24px; }
    .page h2 { font-size: 21px; }
    .kv { grid-template-columns: minmax(0, 1fr); }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile .n { font-size: 28px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">YASAKANI</div>
  <div class="model" id="state"><span class="st" id="st"></span><span id="st_more"></span></div>
  <div class="meter" title="tokens per second"><span class="num" id="num">–</span><span class="unit">tok/s</span><span class="what" id="what"></span></div>
  <button class="btn2" id="quit" type="button" hidden></button>
</header>
<nav class="tabs" id="tabs" role="tablist">
  <button id="t_chat" type="button" role="tab" aria-controls="p_chat" aria-selected="true"></button>
  <button id="t_speed" type="button" role="tab" aria-controls="p_speed" aria-selected="false" tabindex="-1"></button>
  <button id="t_api" type="button" role="tab" aria-controls="p_api" aria-selected="false" tabindex="-1"></button>
  <button id="t_model" type="button" role="tab" aria-controls="p_model" aria-selected="false" tabindex="-1"></button>
</nav>
<div class="upd" id="upd" hidden><span id="upd_text"></span><button class="go" id="upd_go" type="button"></button><button class="link" id="upd_later" type="button"></button></div>
<div class="upd" id="ask" hidden><span id="ask_text"></span><button class="go" id="ask_yes" type="button"></button><button class="link" id="ask_no" type="button"></button></div>
<div class="load" id="load" hidden><div class="col">
  <div class="lt" id="load_text"></div>
  <div class="track" id="load_bar"><i></i></div>
  <div class="lh" id="load_hint"></div>
</div></div>

<section class="pane chat" id="p_chat" role="tabpanel" aria-labelledby="t_chat">
  <main id="main"><div class="col" id="log"></div></main>
  <div class="composer" id="composer"><div class="col">
    <div class="imgnote" id="imgnote" role="status" hidden></div>
    <div class="chips" id="chips" hidden></div>
    <div class="row">
      <button class="attach" id="attach" type="button" hidden></button>
      <input type="file" id="pick" accept="image/*" multiple hidden>
      <textarea id="box" rows="1" autofocus></textarea>
      <button class="send" id="send" type="button"></button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="think" checked><span id="l_think"></span></label>
      <label><span id="l_effort"></span><select id="effort"><option value="xhigh" selected></option><option value="medium"></option><option value="low"></option></select></label>
      <button class="link" id="fresh" type="button"></button>
      <span class="local" id="l_local"></span>
    </div>
  </div></div>
</section>

<section class="pane page" id="p_speed" role="tabpanel" aria-labelledby="t_speed" hidden><div class="col">
  <h2 id="sp_title"></h2>
  <p class="lead" id="sp_lead"></p>
  <div class="line"><button class="btn" id="sp_go" type="button"></button><span id="sp_state"></span></div>
  <p class="hint" id="sp_why"></p>
  <div class="tiles">
    <div class="tile main"><div class="k" id="sp_l_avg"></div><span class="n" id="sp_avg">–</span><span class="u">tok/s</span></div>
    <div class="tile"><div class="k" id="sp_l_peak"></div><span class="n" id="sp_peak">–</span><span class="u">tok/s</span></div>
    <div class="tile"><div class="k" id="sp_l_ttft"></div><span class="n" id="sp_ttft">–</span><span class="u" id="sp_u_sec"></span></div>
    <div class="tile"><div class="k" id="sp_l_tok"></div><span class="n" id="sp_tok">–</span></div>
  </div>
  <p class="hint" id="sp_note"></p>
  <p class="hint" id="sp_cond"></p>
</div></section>

<section class="pane page" id="p_api" role="tabpanel" aria-labelledby="t_api" hidden><div class="col">
  <h2 id="api_title"></h2>
  <p class="lead" id="api_lead"></p>
  <div class="kv"><div class="k" id="api_l_base"></div><div class="v line"><code id="api_base">–</code><button class="copy" id="c_base" type="button" data-from="api_base"></button></div></div>
  <div class="kv"><div class="k" id="api_l_model"></div><div class="v line"><code id="api_model">–</code><button class="copy" id="c_model" type="button" data-from="api_model"></button></div></div>
  <div class="kv"><div class="k" id="api_l_key"></div><div class="v" id="api_key_v"></div></div>
  <p class="hint" id="api_note"></p>
  <div id="api_samples"></div>
  <p class="hint" id="api_local"></p>
</div></section>

<section class="pane page" id="p_model" role="tabpanel" aria-labelledby="t_model" hidden><div class="col">
  <h2 id="md_title"></h2>
  <div class="kv"><div class="k" id="md_l_state"></div><div class="v" id="m_state"></div></div>
  <div class="kv"><div class="k" id="md_l_models"></div><div class="v"><div id="m_list"></div><p class="hint bad" id="m_note"></p><p class="hint" id="m_hint"></p></div></div>
  <div class="kv"><div class="k" id="md_l_gpu"></div><div class="v"><span id="gpu_name"></span><span class="sub" id="gpu_drv"></span></div></div>
  <div class="kv"><div class="k" id="md_l_mem"></div><div class="v"><div class="mem" id="mem_bar" hidden><i id="mem_fill"></i></div><span id="mem_text"></span></div></div>
  <div class="kv"><div class="k" id="md_l_ctx"></div><div class="v" id="ctx_v"></div></div>
  <div class="kv"><div class="k" id="md_l_ver"></div><div class="v"><span id="ver_v"></span><button class="btn2" id="chk_upd" type="button" hidden></button><p class="hint" id="chk_note" aria-live="polite"></p></div></div>
  <div class="kv" id="row_quit" hidden><div class="k" id="md_l_quit"></div><div class="v"><button class="btn2" id="quit2" type="button"></button><p class="hint" id="md_quit_hint"></p></div></div>
</div></section>

<footer id="support"></footer>
<div class="sr" id="live" aria-live="polite"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const CSV = 'name,age,city\nSato,34,Tokyo\nSuzuki,28,Osaka\nTakahashi,41,Nagoya\nTanaka,25,Fukuoka\nIto,37,Sapporo\nWatanabe,52,Sendai';
const TEXT = {
  ja: {

// ---- copying.  One click on a "copy" button puts the text of its code block (or of the element named in data-from) on the
//      clipboard.  Where the browser gives no clipboard, the text is selected instead and the button says to press Ctrl+C.
async function copyText(btn, node) {
  let done = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(node.textContent); done = true; }
  } catch (e) { done = false; }
  if (!done) {
    try { const r = document.createRange(); r.selectNodeContents(node); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* the text stays readable */ }
  }
  btn.textContent = done ? L.copied : L.copy_fail;
  setTimeout(() => { btn.textContent = L.copy; }, done ? 1500 : 6000);
}
document.addEventListener('click', e => {
  const b = e.target instanceof Element ? e.target.closest('button.copy') : null;
  if (!b) return;
  const node = b.dataset.from ? $(b.dataset.from) : b.parentNode.querySelector('pre');
  if (node) copyText(b, node);
});
function codeBlock(code) {
  const box = el('div', 'cb'), pre = el('pre'), b = el('button', 'copy', L.copy);
  pre.appendChild(el('code', null, code)); b.type = 'button';
  box.appendChild(pre); box.appendChild(b);

// ---- rendering of one answer.  Everything goes in as text, never as HTML.  The Markdown marks the model uses most are
//      shown as what they mean: ``` fenced blocks, `inline code`, **bold**, # headings, > quotes, - lists, --- rules and
//      | tables |.  Anything else (links, formulas, *italics*) stays as it was written.
function codeInto(node, text) {
  text.split(/(`[^`\n]+`)/).forEach(seg => {
    if (seg.length > 2 && seg[0] === '`' && seg[seg.length - 1] === '`') node.appendChild(el('code', null, seg.slice(1, -1)));
    else if (seg) node.appendChild(document.createTextNode(seg));
  });
}
function inlineInto(node, text) {
  text.split(/(`[^`\n]+`|\*\*(?=\S)[^*\n]*?[^*\s]\*\*)/).forEach(seg => {
    if (seg.length > 4 && seg.startsWith('**') && seg.endsWith('**')) { const s = el('strong'); codeInto(s, seg.slice(2, -2)); node.appendChild(s); }
    else codeInto(node, seg);
  });
}
const isRow = s => /^\s*\|.*\|\s*$/.test(s);
const rowCells = s => s.trim().slice(1, -1).split('|').map(c => c.trim());
const isRule = s => isRow(s) && rowCells(s).every(c => /^:?-+:?$/.test(c));
function proseInto(node, part) {
  const lines = part.split('\n');
  let cur = null, curKind = '';
  const add = (kind, text) => {
    if (!cur || curKind !== kind) { cur = el(kind === 'q' ? 'blockquote' : 'p'); curKind = kind; node.appendChild(cur); }
    else cur.appendChild(document.createTextNode('\n'));
    inlineInto(cur, text);
  };
  for (let i = 0; i < lines.length; i++) {
    const s = lines[i].replace(/\s+$/, '');
    let m;
    if (!s) { cur = null; continue; }
    if (isRow(s) && i + 1 < lines.length && isRule(lines[i + 1]) && rowCells(lines[i + 1]).length === rowCells(s).length) {
      cur = null;
      const table = el('table'), n = rowCells(s).length;
      const row = (text, tag) => { const tr = el('tr'); rowCells(text).slice(0, n).forEach(c => { const cell = el(tag); inlineInto(cell, c); tr.appendChild(cell); }); table.appendChild(tr); };
      row(s, 'th');
      for (i += 2; i < lines.length && isRow(lines[i]); i++) row(lines[i], 'td');
      i--;
      const wrap = el('div', 'tw'); wrap.appendChild(table); node.appendChild(wrap);
      continue;
    }
    if ((m = /^ {0,3}#{1,6}\s+(.+)$/.exec(s))) { cur = null; const h = el('p', 'h'); inlineInto(h, m[1]); node.appendChild(h); continue; }
    if (/^ {0,3}(?:-{3,}|\*{3,}|_{3,})$/.test(s)) { cur = null; node.appendChild(el('hr')); continue; }
    if ((m = /^ {0,3}>\s?(.*)$/.exec(s))) { add('q', m[1]); continue; }
    if ((m = /^(\s*)[-*+]\s+(.+)$/.exec(s))) { add('p', m[1] + '• ' + m[2]); continue; }
    add('p', s);
  }
}
// The answer is painted again and again while it arrives.  The pieces between ``` marks that did not change keep their
// elements (only the last piece grows), so the copy button of a finished code block is still the same button when it is clicked.
const painted = new WeakMap();           // node -> [{text, nodes}] in the order of the pieces
function renderInto(node, raw) {
  const parts = raw.split(/```/);
  let kept = painted.get(node);
  if (!kept) { kept = []; painted.set(node, kept); node.textContent = ''; }
  let same = 0;
  while (same < kept.length && same < parts.length && kept[same].text === parts[same]) same++;
  for (const old of kept.splice(same)) for (const n of old.nodes) n.remove();
  for (let i = same; i < parts.length; i++) {
    const part = parts[i], piece = document.createDocumentFragment();
    if (i % 2 === 1) {
      const nl = part.indexOf('\n');
      const code = nl >= 0 && /^[\w+#.-]{0,20}$/.test(part.slice(0, nl).trim()) ? part.slice(nl + 1) : part;
      piece.appendChild(codeBlock(code.replace(/\n$/, '')));
    } else proseInto(piece, part);
    kept.push({ text: part, nodes: Array.from(piece.childNodes) });
    node.appendChild(piece);
  }
}
const nearBottom = () => { const m = $('main'); return m.scrollHeight - m.scrollTop - m.clientHeight < 120; };
const toBottom = () => { const m = $('main'); m.scrollTop = m.scrollHeight; };

// ---- the speed meter: tokens that arrived in the last second
const arrivals = [];
let meterTimer = null, meterFirst = 0;
function meterTick() {
  const now = performance.now();
  while (arrivals.length && now - arrivals[0] > 1000) arrivals.shift();
  if (!busy && !bench) return;
  if (arrivals.length && !meterFirst) meterFirst = arrivals[0];
  const span = Math.min(1000, now - meterFirst);            // in the first second, divide by the time that has passed
  $('num').textContent = arrivals.length && span >= 250 ? fmt(Math.round(arrivals.length * 1000 / span)) : '–';
  $('what').textContent = L.w_now;
}
function meterStart() { arrivals.length = 0; meterFirst = 0; $('num').textContent = '–'; $('what').textContent = L.w_now; meterTimer = setInterval(meterTick, 200); }
function meterEnd(avg) { clearInterval(meterTimer); meterTimer = null; $('num').textContent = avg ? fmt(Math.round(avg)) : '–'; $('what').textContent = avg ? L.w_avg : L.w_idle; }

// ---- one streamed answer of /v1/chat/completions: `each` gets every JSON event of the stream
async function refusal(r) {
  let m = r.statusText;
  try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (e) { /* not JSON */ }
  return Object.assign(new Error(t('err_http', { c: r.status, m })), { shown: true });
}
async function readEvents(r, each) {
  const reader = r.body.getReader(); const dec = new TextDecoder('utf-8');
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0) {
      const line = buf.slice(0, cut).trim(); buf = buf.slice(cut + 2);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') continue;
      let o; try { o = JSON.parse(data); } catch (e) { continue; }
      each(o);
    }
  }
}

async function send() {
  const box = $('box');
  const text = box.value.trim();
  const images = vision ? attached.slice() : [];
  if ((!text && !images.length) || busy || bench || !ready) return;
  const msg = images.length ? images.map(a => ({ type: 'image_url', image_url: { url: a.uri } })).concat(text ? [{ type: 'text', text }] : []) : text;
  if (images.length || history.some(m => Array.isArray(m.content))) {      // the launcher takes bodies up to 16 MiB
    const size = new TextEncoder().encode(JSON.stringify({ messages: history.concat([{ role: 'user', content: msg }]) })).length + 4096;
    if (size > BODY_MAX) { imgNote(t('img_total', { n: BODY_MAX / 1024 / 1024 })); return; }
  }
  box.value = ''; attached = []; paintImages(); imgNote(''); grow();
  const mine = addTurn('me', text);
  if (images.length) mine.body.insertBefore(el('div', 'imgs', t('img_sent', { n: images.length }) + ': ' + images.map(a => a.name).join(', ')), mine.body.firstChild);
  const conv = history;
  history.push({ role: 'user', content: msg });
  const { turn, body } = addTurn('ai');
  const think = el('details', 'think'); const sum = el('summary'); const thinkText = el('div', 't');
  think.appendChild(sum); think.appendChild(thinkText);
  const answer = el('div');
  let reasoning = '', content = '', nThink = 0, nAnswer = 0, tFirst = 0, tLast = 0, usage = null, finish = null, failed = null, dirty = false;
  const paint = () => {
    if (!dirty) return; dirty = false;
    const stick = nearBottom();
    if (reasoning && !think.parentNode) { body.insertBefore(think, body.firstChild); think.open = true; }
    if (reasoning) { thinkText.textContent = reasoning; sum.textContent = t(content ? 'thought' : 'thinking', { n: fmt(nThink) }); if (content && think.open && !think.dataset.kept) { think.open = false; think.dataset.kept = '1'; } }
    if (content) { if (!answer.parentNode) body.appendChild(answer); renderInto(answer, content); }
    if (stick) toBottom();
  };
  const painter = setInterval(paint, 66);
  busy = new AbortController(); refresh(); meterStart();
  const payload = { messages: history.slice(), stream: true, stream_options: { include_usage: true } };
  // Thinking off is a switch of the chat template; with thinking on, reasoning_effort (low, medium, xhigh) says how long the
  // model thinks (xhigh is also what the model does when nothing is said).
  if (!$('think').checked) payload.chat_template_kwargs = { enable_thinking: false };
  else payload.reasoning_effort = $('effort').value;
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: busy.signal });
    if (!r.ok) throw await refusal(r);
    await readEvents(r, o => {
      if (o.error) { failed = t('err_http', { c: o.error.code || 500, m: o.error.message || '' }); return; }
      if (o.usage) usage = o.usage;
      const c = o.choices && o.choices[0];
      if (!c) return;
      if (c.finish_reason) finish = c.finish_reason;
      const d = c.delta || {};
      const now = performance.now();
      if (typeof d.reasoning_content === 'string' && d.reasoning_content) { reasoning += d.reasoning_content; nThink++; }
      else if (typeof d.content === 'string' && d.content) { content += d.content; nAnswer++; }
      else return;
      if (!tFirst) tFirst = now;
      tLast = now; arrivals.push(now); dirty = true;
    });
  } catch (e) {
    if (e.name === 'AbortError') failed = L.stopped; else failed = e.shown ? e.message : L.err_net;
    if (!e.shown && e.name !== 'AbortError') pollIn(300);        // the state line says soon whether the server is gone
  }
  clearInterval(painter);
  if (conv !== history) return;
  dirty = true; paint();
  busy = null; refresh();
  const n = usage ? usage.completion_tokens : nThink + nAnswer;
  const secs = (tLast - tFirst) / 1000;
  const avg = n >= 16 && secs > 0.15 ? (n - 1) / secs : 0;
  meterEnd(avg);
  if (n > 0) {
    const stamp = el('div', 'stamp');
    if (avg) { const s = el('span'); s.appendChild(el('b', null, fmt(Math.round(avg)))); s.appendChild(document.createTextNode(' tok/s')); stamp.appendChild(s); }
    stamp.appendChild(el('span', null, t('s_tok', { n: fmt(n) })));
    const nt = usage && usage.completion_tokens_details ? usage.completion_tokens_details.reasoning_tokens : nThink;
    if (nt) stamp.appendChild(el('span', null, t('s_think', { n: fmt(nt) })));
    if (secs > 0) stamp.appendChild(el('span', null, t('s_sec', { n: secs.toFixed(2) })));
    turn.appendChild(stamp);
  }
  if (failed) turn.appendChild(el('div', 'note', failed));
  else if (finish === 'length') turn.appendChild(el('div', 'note', L.cut));
  if (content) history.push({ role: 'assistant', content });
  else history.pop();                    // nothing was answered: the question is not kept, so it can be sent again
  if (nearBottom()) toBottom();
  if (tab === 'chat') $('box').focus();
}

// ---- the speed tab.  One fixed prompt, thinking off, sent the way the chat sends its questions.  The figures are a rough
//      in-browser measurement of this prompt (the page says so); `yasakani bench` gives the project's standard numbers.
const BENCH_MAX = 768;
const BENCH_PROMPT = 'Write a Python class for a small LRU cache with get, put and delete, with type hints and docstrings. '
  + 'Then write five unit tests for it and explain the design in a few short paragraphs.';
// The highest rate over one full second of the run, in arriving pieces; a run shorter than a second has only its average.
function peakRate(stamps) {
  let best = 0, lo = 0;
  for (let hi = 0; hi < stamps.length; hi++) {
    while (stamps[hi] - stamps[lo] >= 1000) lo++;
    if (stamps[hi] - stamps[0] >= 1000) best = Math.max(best, hi - lo + 1);
  }
  return best;
}

  const b = $('sp_go');

  b.disabled = !bench && (!ready || !!busy);

}

  refresh(); meterStart();

  const payload = { messages: [{ role: 'user', content: BENCH_PROMPT }], stream: true, stream_options: { include_usage: true },
                    temperature: 0, max_tokens: BENCH_MAX, chat_template_kwargs: { enable_thinking: false } };
  const tSend = performance.now();

    if (!r.ok) throw await refusal(r);
    await readEvents(r, o => {
      if (o.error) { failed = t('err_http', { c: o.error.code || 500, m: o.error.message || '' }); return; }
      if (o.usage) usage = o.usage;
      const d = (o.choices && o.choices[0] && o.choices[0].delta) || {};
      if (!(typeof d.content === 'string' && d.content) && !(typeof d.reasoning_content === 'string' && d.reasoning_content)) return;
      const now = performance.now();
      stamps.push(now); arrivals.push(now);
    });
  } catch (e) {
    if (e.name === 'AbortError') failed = L.stopped; else failed = e.shown ? e.message : L.err_net;
    if (!e.shown && e.name !== 'AbortError') pollIn(300);
  }
  clearInterval(live);
  bench = null; benchDone = true;
  // The average as the launcher's self-test computes it: the reported tokens over the time between the first and the last piece.
  const pieces = stamps.length, n = usage ? usage.completion_tokens : pieces;
  const secs = pieces ? (stamps[pieces - 1] - stamps[0]) / 1000 : 0;
  const avg = n > 16 && secs > 0.1 ? (n - 1) / secs : 0;
  const peak = avg ? Math.max(avg, peakRate(stamps) * n / pieces) : 0;       // pieces -> tokens; never under the average
  meterEnd(avg);
  $('sp_avg').textContent = avg ? fmt(Math.round(avg)) : '–';
  $('sp_peak').textContent = peak ? fmt(Math.round(peak)) : '–';
  $('sp_ttft').textContent = pieces ? ((stamps[0] - tSend) / 1000).toFixed(2) : '–';
  $('sp_tok').textContent = pieces ? fmt(n) : '–';
  state.className = failed ? 'hint bad' : '';
  state.textContent = failed || (avg ? t('sp_done', { s: ((stamps[pieces - 1] - tSend) / 1000).toFixed(1) }) : L.sp_short);
  refresh();
}
$('sp_go').addEventListener('click', () => { if (bench) bench.abort(); else measure(); });

// ---- the API tab: the address of `yasakani serve` for other programs, and two samples made from it.
//      A sample is program text and a command line that people paste and run.  The model id comes from the model's folder, so
//      it goes into a sample only when it is made of plain characters (no quote, space, &, |, <, >, ^, % or the like), and the
//      address only in the form the launcher builds it.  Otherwise the two fields above stay and no sample is shown.
const ID_OK = /^[A-Za-z0-9][A-Za-z0-9._:\/@+-]{0,199}$/;
const BASE_OK = /^http:\/\/127\.0\.0\.1:\d{1,5}\/v1$/;
let apiShown = null;
function paintApi() {
  const base = typeof cfg.api_base === 'string' ? cfg.api_base : '', id = modelId();
  put('api_base', base || '–'); put('api_model', id || '–');
  $('c_base').disabled = !base; $('c_model').disabled = !id;
  put('api_note', waiting() ? L.api_wait : phase !== 'ready' && phase !== 'updating' ? L.api_off : !base ? L.api_none : '');
  const key = base + '\n' + id + '\n' + L.title;
  if (key === apiShown) return;            // the samples (and their copy buttons) stay as they are until an input changes
  apiShown = key;
  const box = $('api_samples'); box.textContent = '';
  if (!base || !id) return;
  if (!BASE_OK.test(base)) { box.appendChild(el('p', 'hint', L.api_odd_base)); return; }
  if (!ID_OK.test(id)) { box.appendChild(el('p', 'hint', L.api_odd)); return; }
  const py = ['from openai import OpenAI', '',
              'client = OpenAI(base_url="' + base + '", api_key="unused")',
              'r = client.chat.completions.create(',
              '    model="' + id + '",',
              '    messages=[{"role": "user", "content": "Hello!"}],',
              ')',
              'print(r.choices[0].message.content)'].join('\n');
  const curl = 'curl ' + base + '/chat/completions -H "Content-Type: application/json" ^\n'
             + '  -d "{\\"model\\":\\"' + id + '\\",\\"messages\\":[{\\"role\\":\\"user\\",\\"content\\":\\"Hello!\\"}]}"';
  box.appendChild(el('h3', null, L.api_py)); box.appendChild(codeBlock(py));
  box.appendChild(el('h3', null, L.api_curl)); box.appendChild(codeBlock(curl));
}

// ---- the model tab: the GPU and its memory (read again every few seconds while the tab is on screen), the context limit,
//      and the downloaded models with a switch button each
let modelsShown = null;
function paintModel() {
  const g = cfg.gpu && typeof cfg.gpu === 'object' ? cfg.gpu : {};
  put('gpu_name', g.name ? String(g.name) : L.unknown);
  put('gpu_drv', g.driver ? t('md_driver', { v: String(g.driver) }) : '');
  const total = typeof g.total_mib === 'number' ? g.total_mib : 0, used = typeof g.used_mib === 'number' ? g.used_mib : -1;
  const dead = over() || phase === 'gone';                           // what was read before says nothing about now
  const known = !dead && total > 0 && used >= 0;
  $('mem_bar').hidden = !known;
  $('mem_fill').style.width = known ? Math.min(100, used / total * 100).toFixed(1) + '%' : '0';
  put('mem_text', known ? t('md_mem_v', { u: fmt(used), t: fmt(total) }) : dead ? '–' : L.unknown);
  const ctx = ctxLimit();
  put('ctx_v', waiting() ? L.md_ctx_wait : phase !== 'ready' ? '–' : ctx ? t('md_ctx_v', { n: fmt(ctx) }) : L.unknown);
  put('ver_v', cfg.version ? String(cfg.version) : L.unknown);
  const custom = !(cfg.model in KNOWN);
  const rows = (Array.isArray(cfg.models_installed) ? cfg.models_installed : []).filter(m => m && m.name in KNOWN)
    .map(m => ({ name: m.name, current: !!m.current }));
  if (!rows.some(m => m.current)) rows.unshift({ name: cfg.model, current: true });
  // The mark beside a model: in use, loading (during a switch: the model that was asked for), or nothing when no model runs.
  const coming = checking ? L.md_check : L.md_wait;
  for (const m of rows) {
    m.mark = phase === 'ready' ? (m.current ? L.md_cur : '') : phase === 'loading' ? (m.current ? coming : '')
           : phase === 'switching' ? (m.name === switchTo ? coming : '') : '';
  }
  const can = controls && !custom && (phase === 'ready' || phase === 'loading') && !busy && !bench && !pending;
  put('m_hint', custom ? L.md_custom : !controls ? L.md_old : busy || bench ? L.md_busy : rows.length < Object.keys(KNOWN).length && !dead ? L.md_hint : '');
  const key = JSON.stringify([rows, can, L.title]);
  if (key === modelsShown) return;         // the buttons stay the same elements between two readings of the config
  modelsShown = key;
  const list = $('m_list'); list.textContent = '';
  for (const m of rows) {
    const row = el('div', 'line');
    row.appendChild(el('span', 'nm', modelName(m.name)));
    if (m.mark) row.appendChild(el('span', 'cur', m.mark));
    else if (!m.current) { const b = el('button', 'btn2', L.md_switch); b.type = 'button'; b.dataset.model = m.name; b.disabled = !can; row.appendChild(b); }
    list.appendChild(row);
  }
}
function gpuWatch() {
  clearTimeout(gpuTimer); gpuTimer = null;
  if (tab !== 'model' || document.hidden || quiet()) return;
  gpuTimer = setTimeout(async () => { await loadConfig(); refresh(); gpuWatch(); }, 3000);
}
document.addEventListener('visibilitychange', gpuWatch);

// ---- tabs.  All four stay in the page; a tab only shows its part.  The address keeps the name (#speed, #api, #model).
function showTab(name, fromAddress) {
  tab = TABS.includes(name) ? name : 'chat';
  for (const k of TABS) {
    const on = k === tab, b = $('t_' + k);
    $('p_' + k).hidden = !on; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
  }
  if (!fromAddress) { try { window.history.replaceState(null, '', '#' + tab); } catch (e) { /* the address stays */ } }
  if (tab === 'model' && !quiet()) loadConfig().then(refresh);
  gpuWatch();
}
for (const k of TABS) $('t_' + k).addEventListener('click', () => showTab(k));
$('tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const next = TABS[(TABS.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
  e.preventDefault(); showTab(next); $('t_' + next).focus();
});
window.addEventListener('hashchange', () => showTab(location.hash.slice(1), true));

// ---- the launcher.  GET /webchat/config: the settings (read again when something may have changed).  GET /webchat/status:
//      what the model is doing.  The page opens while the model is still loading, so it asks about once a second until the
//      model is ready and a little less often after that.  It does not ask for ever: "stopping" and "failed" end it, and so does a
//      launcher that stays silent (LOST_MS; much longer after a model switch).  The page then says so and asks nothing more.
// One GET.  It gives up after ASK_MS, so that a launcher that is busy or gone cannot keep the page waiting.
async function get(path) {
  const c = new AbortController(), timer = setTimeout(() => c.abort(), ASK_MS);
  try { return await fetch(path, { cache: 'no-store', signal: c.signal }); } finally { clearTimeout(timer); }
}
async function loadConfig() {
  try {
    const r = await get('/webchat/config');
    if (!r.ok) return false;
    const c = await r.json();
    if (!c || typeof c !== 'object' || over()) return false;
    controls = 'control_token' in c;
    Object.assign(cfg, { control_token: null }, c);
    return true;
  } catch (e) { return false; }             // the settings read before stay
}
async function loadVision() {
  try {
    const r = await get('/v1/models'); const j = await r.json();
    const first = j && Array.isArray(j.data) ? j.data[0] : null;
    vision = !!(first && first.vision === true);
  } catch (e) { vision = false; }
  if (!vision) clearImages();
}
async function loadHealth() {
  try {
    const r = await get('/health'); const h = await r.json();
    if (h && h.status === 'ok') health = h;
  } catch (e) { /* the state line shows less */ }
}
async function askStatus() {
  if (statusApi) {
    try {
      const r = await get('/webchat/status');
      if (r.status !== 404) return r.ok ? await r.json() : null;
      statusApi = false;
    } catch (e) { return null; }
  }
  // An older launcher has no /webchat/status: the engine's /health tells loading from ready, as this page always asked it.
  // Any answer means that the launcher is there; only a request that fails counts as "no answer".
  try {
    const r = await get('/health'); let h = null;
    try { h = await r.json(); } catch (e) { /* not JSON: not ready */ }
    if (h && h.status === 'ok') { health = h; return { state: 'ready' }; }
    return { state: 'loading' };
  } catch (e) { return null; }
}
async function onStatus(s) {
  if (quiet()) return;            // quit, update or a final state came while the question was under way: that state stands
  const was = phase, now = performance.now();
  if (!s || typeof s.state !== 'string') {                  // no answer
    if (!lostAt) lostAt = now;
    lostTries++; gap = true; health = null;
    // Between two models the launcher's server is closed, and before a model is used for the first time the launcher checks
    // it for minutes, with or without answers: the page keeps the state it shows and waits much longer than usual.
    const slow = was === 'switching' || checking;
    if (now - lostAt < LOST_MS || lostTries < 3 || (slow && now - (switchAt || lostAt) < SWITCH_MS)) {
      if (!slow) { phase = 'gone'; ready = false; }
      return;
    }
    endNow('ended', slow ? 'ld_sw_lost' : 'ld_ended');      // silent for too long: the page says so and stops asking
    return;
  }
  lostAt = 0; lostTries = 0;
  if (s.state === 'stopping') { endNow('stopped', 'ld_stopped'); return; }      // "quit" in another tab, or Enter in the black window
  if (s.state === 'failed') { endNow('failed'); return; }   // `yasakani serve` ended by itself
  checking = s.phase === 'checking';                        // absent with a launcher that does not tell
  if (s.state === 'switching') {
    // a switch this page did not ask for (another tab, or the page was loaded during it): the launcher tells how long the checks run
    if (was !== 'switching') { switchAt = now - (checking && typeof s.elapsed === 'number' && s.elapsed > 0 ? s.elapsed * 1000 : 0); switchTo = ''; health = null; }
    if (checking && !switchTo && typeof s.model === 'string' && s.model in KNOWN) switchTo = s.model;       // the model that is checked
    phase = 'switching'; ready = false; ran = false; return;
  }
  const up = s.state === 'ready', other = typeof s.model === 'string' && s.model !== cfg.model;
  // Right after a switch was accepted, an answer that still names another model is the old server's last word.
  if (was === 'switching' && switchTo && typeof s.model === 'string' && s.model !== switchTo && now - switchAt < 15000) return;
  if (gap || other || was === 'switching' || was === 'gone' || (up && was !== 'ready')) {
    gap = false;
    if (other || was === 'switching') health = null;
    await loadConfig();                                     // the model, a new control token and, once ready, the context limit
    if (up && !ctxLimit()) await loadHealth();
    if (up) await loadVision(); else { vision = false; clearImages(); }
    if (phase !== was) return;                              // a button was pressed meanwhile (quit, switch, update): its state stands
  }
  if (typeof s.elapsed === 'number') { loadBase = s.elapsed; loadAt = now; }
  else if (!up && was !== 'loading') { loadBase = 0; loadAt = now; }
  phase = up ? 'ready' : 'loading'; ready = up;
  if (switchTo && typeof s.model === 'string' && s.model !== switchTo) $('m_note').textContent = L.md_sw_back;      // the launcher went back to the model before
  switchAt = 0; switchTo = '';                              // the switch is over: the seconds shown are the launcher's own again
  if (up) { ran = true; checking = false; }
}
function pollIn(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(tick, ms); }
async function tick() {
  if (ticking || quiet()) return;
  ticking = true;
  const was = phase;
  try { await onStatus(await askStatus()); } catch (e) { /* the next round asks again */ }
  ticking = false;
  if (quiet()) return;
  refresh();
  if (phase === 'ready' && was !== 'ready' && tab === 'chat' && (!document.activeElement || document.activeElement === document.body)) $('box').focus();
  // Also when ready the page asks often: after Enter in the black window, or when the model ended by itself, the launcher's
  // server says "stopping" or "failed" for about two seconds only, and the page should hear it and say so.
  pollIn(waiting() ? 1000 : 1500);
}

// ---- quit and model switch.  Like the update button below, they ask the launcher (this address) with a one-time token of
//      /webchat/config, here in the X-YASAKANI-Control header.  A token that was refused is never sent again by itself: the
//      config is read once more and the person presses the button again.
//      `say` shows a short text while the page waits; `wanted` says whether the person still wants it when the wait is over.
async function control(path, body, say, wanted) {
  if (!cfg.control_token) {
    // The token in hand was used, or none came yet: the config has the next one.  Right after a model switch the launcher's
    // new server needs a moment, so the config is asked for a few seconds; the page says "one moment" meanwhile.
    if (say) say(L.c_wait);
    const until = performance.now() + 8000;
    for (;;) {
      await loadConfig();
      if (cfg.control_token || quiet() || !(waiting() || phase === 'gone') || performance.now() >= until) break;
      await sleep(1000);
    }
  }
  if (quiet() || (wanted && !wanted())) return { ok: false, dropped: true };
  const token = cfg.control_token;
  if (!token) return { ok: false, later: true };            // nothing can be accepted now (a switch or the checks are under way)
  cfg.control_token = null;
  let r;
  try {
    r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-YASAKANI-Control': token }, body: JSON.stringify(body), cache: 'no-store' });
  } catch (e) { return { ok: false, message: L.gone }; }
  if (r.status === 202) return { ok: true };
  let message = 'HTTP ' + r.status;
  try { const j = await r.json(); if (j.error && j.error.message) message = j.error.message + ' - ' + message; } catch (e) { /* not JSON */ }
  await loadConfig();
  return { ok: false, message, retry: r.status === 403 && !!cfg.control_token };
}
// The final states: "stopped" (quit), "failed" (the model ended by itself) and "ended" (the launcher stayed silent, or a
// switch or an update never came back).  `why` names the text that explains it.  From here on nothing asks the launcher.
function endNow(state, why) {
  phase = state; ready = false; checking = false; endText = why || '';
  if (state === 'stopped') { if (busy) busy.abort(); if (bench) bench.abort(); }
  clearTimeout(pollTimer); clearTimeout(gpuTimer); clearInterval(clockTimer);
  $('ask').hidden = true; $('upd').hidden = true; updOff = true;
  refresh();
}
let asked = 0;                 // counts the quit questions: a "yes" counts only for the question it was given to
function askQuit() {
  if (quiet()) return;
  asked++;
  $('ask_text').textContent = L.q_ask; $('ask_yes').disabled = false; $('ask').hidden = false;
  $('ask_no').focus();
}
$('quit').addEventListener('click', askQuit);
$('quit2').addEventListener('click', askQuit);
$('ask_no').addEventListener('click', () => { asked++; $('ask').hidden = true; });
$('ask_yes').addEventListener('click', async () => {
  const mine = asked;
  $('ask_yes').disabled = true;
  const res = await control('/webchat/shutdown', {}, text => { $('ask_text').textContent = text; }, () => asked === mine);
  if (res.ok) { endNow('stopped', 'q_done'); return; }
  if (res.dropped) return;                                  // "cancel" was pressed meanwhile, or it ended by itself
  $('ask_yes').disabled = false;
  $('ask_text').textContent = res.later ? L.c_later : res.retry ? L.c_retry : t('q_fail', { m: res.message });
});
$('m_list').addEventListener('click', async e => {
  const b = e.target instanceof Element ? e.target.closest('button[data-model]') : null;
  if (!b || b.disabled || pending || busy || bench) return;
  const name = b.dataset.model;
  pending = true; $('m_note').textContent = ''; paintModel();
  const res = await control('/webchat/switch_model', { model: name }, text => { $('m_note').textContent = text; });
  pending = false;
  $('m_note').textContent = res.ok || res.dropped ? '' : res.later ? L.c_later : res.retry ? L.c_retry : t('md_sw_fail', { m: res.message });
  if (res.ok && !quiet()) {
    phase = 'switching'; ready = false; ran = false; checking = false; health = null;
    switchAt = performance.now(); switchTo = name; lostAt = 0; lostTries = 0;
    pollIn(1000);
  }
  refresh();
});

// The launcher found a newer version.  The page itself asks nothing of GitHub; the button asks the launcher (this address),
// with the one-time token of /webchat/config.  The launcher stops the server, updates and starts again on the same port.
function showUpdate() {
  const u = cfg.update;
  if (!u || !cfg.update_token || updOff || !$('upd').hidden) return;
  $('upd_text').textContent = t('upd', { v: u.version });
  $('upd_go').textContent = L.upd_go; $('upd_later').textContent = L.upd_later;
  $('upd').hidden = false;
}
$('upd_later').addEventListener('click', () => { $('upd').hidden = true; updOff = true; });

// "Check for updates" (beside the version in the model tab): asks the launcher to ask github.com now, once, as item 7 of its
// menu does.  Only a launcher that says so in its config (update_check_now) and gave this page its control token takes it; the
// token is sent in the X-YASAKANI-Control header and is not used up.  A newer version: the launcher's config then has it, and the
// banner above appears as when the launcher knew it at the start.  Hidden while an update is known or under way.
function paintCheck() {
  const show = controls && cfg.update_check_now === true && !cfg.update && !quiet();
  const b = $('chk_upd');
  b.hidden = !show && !checkingUpd; b.disabled = checkingUpd;
  put('chk_upd', checkingUpd ? L.chk_run : L.chk); b.title = L.chk_tip;
  if (!show && !checkingUpd) put('chk_note', '');
}
$('chk_upd').addEventListener('click', async () => {
  if (checkingUpd || quiet()) return;
  if (!cfg.control_token) await loadConfig();
  const token = cfg.control_token;
  if (!token) { put('chk_note', L.c_later); return; }
  checkingUpd = true; put('chk_note', ''); paintCheck();
  let note = '';
  const c = new AbortController(), timer = setTimeout(() => c.abort(), CHECK_MS);
  try {
    const r = await fetch('/webchat/check_update', { method: 'POST', headers: { 'X-YASAKANI-Control': token }, cache: 'no-store', signal: c.signal });
    let j = null;
    try { j = await r.json(); } catch (e) { /* not JSON */ }
    if (r.status === 403) { await loadConfig(); note = L.c_retry; }
    else if (!r.ok || !j || typeof j !== 'object') note = t('chk_fail', { m: (j && j.error && j.error.message) || 'HTTP ' + r.status });
    else if (j.state === 'newer') { await loadConfig(); }        // the config has the update and its token: the banner shows
    else if (j.state === 'latest') note = t('chk_latest', { v: String(j.version) });
    else if (j.state === 'busy') note = L.chk_busy;
    else note = t('chk_fail', { m: String(j.message || '') });
  } catch (e) { note = t('chk_fail', { m: e.name === 'AbortError' ? 'timeout' : L.gone }); }
  finally { clearTimeout(timer); }
  checkingUpd = false;
  if (quiet()) return;
  refresh(); put('chk_note', note);
});
$('upd_go').addEventListener('click', async () => {
  if (busy) busy.abort();
  if (bench) bench.abort();
  $('upd_go').disabled = true;
  try {
    const r = await fetch('/webchat/update', { method: 'POST', headers: { 'X-Yasakani-Token': cfg.update_token }, cache: 'no-store' });
    if (r.status !== 202) throw new Error('HTTP ' + r.status);
  } catch (e) {
    $('upd_text').textContent = t('upd_fail', { m: e.message }); $('upd_go').disabled = false; return;
  }
  cfg.update_token = null;
  phase = 'updating'; ready = false; checking = false; updOff = true;          // the page loads again when the new version answers (below)
  clearTimeout(pollTimer); clearTimeout(gpuTimer); $('ask').hidden = true;
  refresh();
  $('upd_go').hidden = true; $('upd_later').hidden = true; $('send').disabled = true;
  $('upd_text').textContent = L.upd_wait;
  const t0 = performance.now(), old = cfg.version, oldToken = cfg.control_token;
  let away = false;                       // the server that took the request was seen gone
  (async function back() {
    let c = null;
    try { const r = await get('/webchat/config'); if (r.ok) c = await r.json(); } catch (e) { if (e.name !== 'AbortError') away = true; }
    if (phase !== 'updating') return;
    if (c && c.version && c.version !== old) { location.reload(); return; }
    if (c && typeof c === 'object' && (away || (typeof c.control_token === 'string' && c.control_token !== oldToken))) {
      // A new server of the launcher answers with the version it had: the update did not work and nothing changed.
      controls = 'control_token' in c; Object.assign(cfg, { control_token: null }, c);
      phase = 'loading'; loadBase = 0; loadAt = performance.now(); gap = true;
      $('upd_text').textContent = L.upd_same;
      tick(); return;
    }
    // Not back in time: the update did not finish (the black window says why).  The page says so and stops asking.
    if (performance.now() - t0 > UPDATE_MS) { endNow('ended', 'upd_lost'); return; }
    setTimeout(back, 2000);
  })();
});

(async function start() {
  await loadConfig();                       // without an answer the defaults stay
  if (cfg.lang && TEXT[cfg.lang]) L = TEXT[cfg.lang];
  applyLanguage(); grow(); showTab(location.hash.slice(1), true);
  clockTimer = setInterval(() => { if (waiting()) paintStatus(); }, 500);
  tick();
})();
</script>
</body>
</html>
