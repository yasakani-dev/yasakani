[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yasakani"
dynamic = ["version"]
description = "Run Qwen3.8-27B locally with YASAKANI: CUDA and experimental Apple Silicon Metal, OpenAI-compatible server and terminal chat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.23", "tokenizers>=0.15", "jinja2>=3.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.scripts]
yasakani = "yasakani.cli:main"

[project.optional-dependencies]
vision = ["Pillow>=10"]

[tool.setuptools]
packages = ["yasakani"]

[tool.setuptools.dynamic]
version = { attr = "yasakani.__version__" }
