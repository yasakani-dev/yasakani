name: macOS prebuilt
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: arm64
      - name: Install pinned build dependencies
        run: python -m pip install -r macos/requirements-build.txt ./python
      - name: Build Metal library
        run: |
          cmake -S . -B build -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --parallel 3
      - name: Python and numerical tests
        working-directory: python
        run: python -m unittest discover -v
      - name: Build standalone launcher and runtime
        run: python macos/build.py
      - name: Upload prebuilt ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: YASAKANI-macos-arm64
          path: |
            build/macos-dist/*.zip
            build/macos-dist/*.sha256
          if-no-files-found: error
          retention-days: 30
